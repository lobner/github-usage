name: Labeler

on:
  pull_request:
    types: [opened, closed, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  label:
    uses: BiQ/gh-cut-release/.github/workflows/labeler.yml@v0.1.0
    # This repository has no self-hosted runner, so use a GitHub-hosted one.
    with:
      runs-on: ubuntu-latest
    #   size-ignore: test/data/   # lines under this prefix don't count towards the size label
    permissions:
      contents: read
      issues: write
      pull-requests: write
